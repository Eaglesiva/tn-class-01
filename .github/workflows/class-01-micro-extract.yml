name: Class 01 Micro Page-2 and TOC Text Extraction

on:
  push:
    branches:
      - scert/class-01/micro-extract-2026-11-07
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only the extraction script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF extraction dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf requests

      - name: Fetch and extract Page 2 and TOC text from only the first 40 pages of each book
        run: |
          python .github/scripts/micro_extract_class01.py --output micro-output

      - name: Upload text report artifact
        uses: actions/upload-artifact@v4
        with:
          name: class-01-page2-toc-text-extraction
          path: micro-output/
          if-no-files-found: error
